<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — American Land</title>
  <link rel="stylesheet" href="ESTILOS.CSS">
  <style>
    .star-float {
      position: absolute; pointer-events: none; opacity: .16;
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes float {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(-12px) rotate(8deg); }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="deco deco-1" aria-hidden="true"></div>
    <div class="deco deco-2" aria-hidden="true"></div>
    <span class="star-float" style="top:10%;left:6%;font-size:30px;color:var(--blue);" aria-hidden="true">★</span>
    <span class="star-float" style="top:18%;right:8%;font-size:18px;color:var(--red);animation-delay:1s;" aria-hidden="true">☆</span>
    <span class="star-float" style="bottom:20%;left:10%;font-size:22px;color:var(--blue-light);animation-delay:2s;" aria-hidden="true">★</span>
    <span class="star-float" style="bottom:22%;right:6%;font-size:16px;color:var(--gold);animation-delay:.7s;" aria-hidden="true">★</span>

    <div class="auth-box animate-in" style="max-width:520px;">
   <div class="auth-logo">
  <img src="LOGO.png">
          <g fill="#fff" font-size="7" text-anchor="middle">
            <text transform="rotate(-80 45 45) translate(45 16)"></text>
            <text transform="rotate(-40 45 45) translate(45 16)"></text>
            <text transform="rotate(0  45 45)  translate(45 16)"></text>
            <text transform="rotate(40 45 45)  translate(45 16)"></text>
            <text transform="rotate(80 45 45)  translate(45 16)"></text>
            <text transform="rotate(120 45 45) translate(45 16)"></text>
            <text transform="rotate(160 45 45) translate(45 16)"></text>
            <text transform="rotate(200 45 45) translate(45 16)"></text>
            <text transform="rotate(240 45 45) translate(45 16)"></text>
          </g>
          <text x="45" y="44" fill="#C0392B" font-size="8" font-weight="bold" text-anchor="middle" font-family="serif">AMERICAN</text>
          <text x="45" y="54" fill="#C0392B" font-size="9" font-weight="bold" text-anchor="middle" font-family="serif">LAND</text>
          <text x="45" y="63" fill="#fff" font-size="5" text-anchor="middle" font-family="sans-serif">ENGLISH ACADEMY</text>
        </svg>
      </div>

      <h1 class="auth-title">Registro de datos</h1>

      <form id="register-form" novalidate>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="form-group">
            <label class="form-label" for="nombre">Nombre Completo</label>
            <input class="form-control" type="text" id="nombre" name="nombre"
              placeholder="Tu nombre completo" required autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="email-reg">Correo Electrónico</label>
            <input class="form-control" type="email" id="email-reg" name="email"
              placeholder="tu@correo.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password"
              placeholder="Mínimo 8 caracteres" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirmar Contraseña</label>
            <input class="form-control" type="password" id="confirm-password"
              placeholder="Repite tu contraseña" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="telefono">Número de Teléfono</label>
            <input class="form-control" type="tel" id="telefono" name="telefono"
              placeholder="Ej: 3138132388" autocomplete="tel">
          </div>
          <div class="form-group">
            <label class="form-label" for="nacimiento">Fecha de Nacimiento</label>
            <input class="form-control" type="date" id="nacimiento" name="nacimiento">
          </div>
          <div class="form-group">
            <label class="form-label" for="pais">País</label>
            <select class="form-control" id="pais" name="pais">
              <option value="">Selecciona tu país</option>
              <option value="CO" selected>Colombia</option>
              <option value="VE">Venezuela</option>
              <option value="EC">Ecuador</option>
              <option value="PE">Perú</option>
              <option value="MX">México</option>
              <option value="other">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="ciudad">Ciudad</label>
            <input class="form-control" type="text" id="ciudad" name="ciudad"
              placeholder="Tu ciudad" autocomplete="address-level2">
          </div>
        </div>

        <div class="form-group" style="margin-top:4px;">
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;color:var(--gray-600);">
            <input type="checkbox" required style="width:16px;height:16px;margin-top:2px;accent-color:var(--accent);">
            Acepto los <a href="#" style="color:var(--accent);font-weight:600;">Términos y Condiciones</a>
            y la <a href="#" style="color:var(--accent);font-weight:600;">Política de Privacidad</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;margin-top:8px;">
          Registrarse
        </button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes una cuenta? <a href="INDEX/HTLM">Inicia sesión aquí</a>
      </div>
    </div>
  </div>

  <script src="APP.JS"></script>
</body>
</html>
